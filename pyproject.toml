[project]
name = "signaleyes-mcp"
version = "0.1.0"
description = "MCP server exposing NEO's SignalEyes API as auto-generated tools"
authors = [
    { name = "vivi-neo", email = "vito.vekic@neo.nl" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4",
    "httpx>=0.28.1",
]

[project.scripts]
signaleyes-mcp = "signaleyes_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
markers = [
    "network: hits the real api.neo.nl API (no credentials needed, spec is public)",
]

[tool.coverage.run]
source = ["signaleyes_mcp"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
