[project]
name = "signaleyes-mcp"
version = "0.1.0"
description = "MCP server exposing NEO's SignalEyes API as auto-generated tools"
authors = [
    { name = "vivi-neo", email = "vito.vekic@neo.nl" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
signaleyes-mcp = "signaleyes_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "mypy>=1.14.0",
    "pip>=26.2.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = [
    "network: hits the real api.neo.nl API (no credentials needed, spec is public)",
]

[tool.coverage.run]
source = ["signaleyes_mcp"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# fastmcp's OpenAPI provider isn't publicly typed; everything else is stdlib/httpx.
[[tool.mypy.overrides]]
module = "fastmcp.server.providers.openapi"
ignore_missing_imports = true
